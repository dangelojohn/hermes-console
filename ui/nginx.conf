server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Service worker must always be revalidated.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Manifest + icons: short cache so branding updates propagate.
  location ~ ^/(manifest\.webmanifest|icons/) {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Long-lived hashed assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Proxy API to the sibling container.
  location /api/ {
    proxy_pass http://hermes-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA fallback for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
